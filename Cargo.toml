# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
resolver = "2"
members = [
    "crates/ldap-client-ber",
    "crates/ldap-client-proto",
    "crates/ldap-client-rs",
    "crates/ldap-client-cli",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.6.0"
authors = ["Michael S. Klishin and Contributors"]
rust-version = "1.93"
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/michaelklishin/ldap-client-rs"
repository = "https://github.com/michaelklishin/ldap-client-rs"

[workspace.dependencies]
ldap-client-ber   = { path = "./crates/ldap-client-ber",   version = "0.6.0" }
ldap-client-proto = { path = "./crates/ldap-client-proto", version = "0.6.0" }
ldap-client-rs    = { path = "./crates/ldap-client-rs",    version = "0.6.0" }

bytes       = "1"
thiserror   = "2"
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
tokio-util  = { version = "0.7", features = ["codec"] }
tokio-rustls = "0.26"
rustls      = "0.23"
rustls-pki-types = "1"
webpki-roots = "1"
secrecy     = { version = "0.10", features = ["serde"] }
zeroize     = "1"
tracing     = "0.1"
url         = "2"
futures-util = { version = "0.3", features = ["sink"] }
clap        = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest    = "1"
pretty_assertions = "1"
criterion   = { version = "0.5", features = ["html_reports"] }
