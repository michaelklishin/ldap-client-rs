# SPDX-License-Identifier: MIT OR Apache-2.0

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: michaelklishin/rust-build-package-release-action@v3
        with:
          command: validate-changelog

      - uses: michaelklishin/rust-build-package-release-action@v3
        id: validate-version
        with:
          command: validate-version
          validate-cargo-toml: 'true'

  publish:
    name: Publish to crates.io
    needs: [validate]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # Publish in dependency order.
      # publish-crate treats "already exists" as a no-op, so
      # re-running a partially failed release is safe.

      - name: Publish ldap-client-ber
        uses: michaelklishin/rust-build-package-release-action@v3
        with:
          command: publish-crate
          package: ldap-client-ber
          locked: 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish ldap-client-proto
        uses: michaelklishin/rust-build-package-release-action@v3
        with:
          command: publish-crate
          package: ldap-client-proto
          locked: 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish ldap-client
        uses: michaelklishin/rust-build-package-release-action@v3
        with:
          command: publish-crate
          package: ldap-client
          locked: 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish ldap-client-cli
        uses: michaelklishin/rust-build-package-release-action@v3
        with:
          command: publish-crate
          package: ldap-client-cli
          locked: 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub Release
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: michaelklishin/rust-build-package-release-action@v3
        with:
          command: extract-changelog
          version: ${{ needs.validate.outputs.version }}

      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          body_path: release_notes.md
